name: Обновление подписки Isyzan

on:
  schedule:
    # Каждые 6 часов
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Ручной запуск

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v3
      
      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Установка зависимостей
        run: pip install requests
      
      - name: Запуск синхронизации
        run: python sync_subscription.py
      
      - name: Сохранение изменений
        run: |
          git config --global user.name "Isyzan Bot"
          git config --global user.email "bot@isyzan.com"
          git add subscription.txt happ_subscription.txt stats.json
          git commit -m "Автообновление подписки: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
